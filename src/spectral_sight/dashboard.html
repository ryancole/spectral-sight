<!DOCTYPE html>
<!-- The feed's own dashboard, served at /. Self-contained deliberately: no
     CDN, no fonts, no build step, so it works on a machine that has never
     seen the internet and doubles as an OBS browser source. It is also the
     living proof of the cross-language claim -- a browser is as foreign a
     consumer as exists, and everything it does here rides the same four
     endpoints any other tool would use. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>spectral-sight</title>
<style>
  :root {
    --bg: #0c0f14; --panel: #141922; --edge: #232b38;
    --text: #d7dee8; --dim: #79879a;
    --blue: #4da3ff; --red: #ff5d5d; --gold: #e8c36a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-monospace, Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column; padding: 12px; gap: 12px;
  }
  header {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 8px; padding: 10px 14px;
  }
  header .title { color: var(--gold); font-weight: bold; }
  header .clock { font-size: 20px; font-weight: bold; }
  header .stat { color: var(--dim); }
  header .stat b { color: var(--text); font-weight: normal; }
  #status { margin-left: auto; }
  #status.live { color: #6fdc8c; }
  #status.down { color: var(--red); }
  main { display: flex; gap: 12px; flex: 1; min-height: 0; }
  #map-panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    padding: 12px; display: flex; align-items: center; justify-content: center;
  }
  canvas { image-rendering: auto; }
  aside { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 14px;
  }
  #rosters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  #rosters h2 { font-size: 12px; margin-bottom: 6px; }
  #rosters .blue h2 { color: var(--blue); }
  #rosters .red h2 { color: var(--red); }
  #rosters li { list-style: none; display: flex; gap: 8px; padding: 1px 0; }
  #rosters .lvl { color: var(--dim); width: 3ch; }
  #rosters .dead { text-decoration: line-through; color: var(--dim); }
  #rosters .fog { color: var(--dim); }
  #rosters .self::after { content: " ◈"; color: var(--gold); }
  #log-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #log-panel .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  #log-panel h2 { font-size: 12px; color: var(--dim); }
  #log-panel label { color: var(--dim); font-size: 12px; user-select: none; }
  #log { overflow-y: auto; flex: 1; }
  #log div { padding: 1px 0; border-bottom: 1px solid #10141b; }
  #log .t { color: var(--dim); margin-right: 8px; }
  #log .blue { color: var(--blue); } #log .red { color: var(--red); }
  #log .kind-death { color: var(--red); font-weight: bold; }
  #log .kind-cast { color: var(--gold); }
  #log .kind-gap { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <span class="title">spectral-sight</span>
  <span class="clock" id="clock">--:--</span>
  <span class="stat">source <b id="source">…</b></span>
  <span class="stat">fps <b id="fps">-</b></span>
  <span class="stat">lag <b id="lag">-</b></span>
  <span class="stat">dropped <b id="dropped">0</b></span>
  <span id="status" class="down">connecting…</span>
</header>
<main>
  <div id="map-panel"><canvas id="map" width="420" height="420"></canvas></div>
  <aside>
    <div class="panel" id="rosters">
      <div class="blue"><h2>ORDER</h2><ul id="blue"></ul></div>
      <div class="red"><h2>CHAOS</h2><ul id="red"></ul></div>
    </div>
    <div class="panel" id="log-panel">
      <div class="bar">
        <h2>EVENTS</h2>
        <label><input type="checkbox" id="fog-toggle"> show fog traffic</label>
      </div>
      <div id="log"></div>
    </div>
  </aside>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
let meta = null, frame = null, cropMax = 300;

// The meta is the capability header: without world bounds the map falls back
// to crop pixels, and the header tells us which timeline this even is.
fetch("/meta").then(r => r.json()).then(m => { meta = m; $("source").textContent = m.source; });

function clockText(seconds, observed) {
  if (seconds == null) return "--:--";
  const text = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  return observed ? text : text + "*";
}

// World units when calibrated (y inverted: Summoner's Rift has its origin at
// the bottom-left, canvases at the top-left), crop pixels otherwise.
function place(c) {
  const b = meta && meta.world_bounds;
  if (b && c.world_x != null) {
    return [(c.world_x - b.min_x) / (b.max_x - b.min_x),
            1 - (c.world_y - b.min_y) / (b.max_y - b.min_y)];
  }
  cropMax = Math.max(cropMax, c.x, c.y);
  return [c.x / cropMax, c.y / cropMax];
}

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#232b38";
  ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
  // The river, as one diagonal hint of orientation.
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, h);
  ctx.strokeStyle = "#1a2230"; ctx.lineWidth = 26; ctx.stroke();
  ctx.lineWidth = 1;
  if (!frame) return;
  for (const c of frame.champions) {
    const [nx, ny] = place(c);
    const x = 12 + nx * (w - 24), y = 12 + ny * (h - 24);
    const colour = c.team === "blue" ? "#4da3ff" : "#ff5d5d";
    ctx.globalAlpha = c.visible ? 1.0 : Math.max(0.25, 1 - c.seconds_since_seen / 20);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
    if (c.visible) { ctx.fillStyle = colour; ctx.fill(); }
    else { ctx.strokeStyle = colour; ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]); }
    if (c.is_self) {
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = "#e8c36a"; ctx.stroke();
    }
    if (c.alive === false) {
      ctx.strokeStyle = "#ff5d5d";
      ctx.beginPath();
      ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
      ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
      ctx.stroke();
    }
    if (c.champion) {
      ctx.fillStyle = "#d7dee8"; ctx.font = "10px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(c.champion, x, y - 12);
    }
    ctx.globalAlpha = 1.0;
  }
}

function roster(team) {
  const list = $(team);
  list.replaceChildren();
  const rows = frame.champions.filter(c => c.team === team)
    .sort((a, b) => (a.champion || "~").localeCompare(b.champion || "~"));
  for (const c of rows) {
    const item = document.createElement("li");
    const level = document.createElement("span");
    level.className = "lvl";
    level.textContent = c.level != null ? String(c.level) : "·";
    const name = document.createElement("span");
    name.textContent = c.champion || `track ${c.track_id}`;
    if (c.alive === false) name.className = "dead";
    else if (!c.visible) name.className = "fog";
    if (c.is_self) name.classList.add("self");
    item.append(level, name);
    list.append(item);
  }
}

function onFrame(message) {
  frame = message;
  $("clock").textContent = clockText(message.game_time, message.game_time_observed);
  $("fps").textContent = message.fps != null ? message.fps.toFixed(1) : "-";
  $("lag").textContent = message.lag != null ? `${Math.round(message.lag * 1000)}ms` : "-";
  $("dropped").textContent = message.dropped;
  draw(); roster("blue"); roster("red");
}

const FOG = new Set(["vanished", "reappeared"]);
function logLine(message) {
  const isFog = FOG.has(message.kind);
  if (isFog && !$("fog-toggle").checked) return;
  const line = document.createElement("div");
  if (isFog) line.dataset.fog = "1";
  const when = document.createElement("span");
  when.className = "t";
  when.textContent = clockText(message.game_time, true);
  const what = document.createElement("span");
  what.className = `kind-${message.kind} ${message.team || ""}`;
  what.textContent = message.kind === "gap"
    ? `missed messages ${message.from}–${message.to}`
    : `${message.kind}  ${message.champion || ""}` +
      (message.kind === "cast" ? `  ${(message.drop * 100).toFixed(0)}% of pool` : "") +
      (message.kind === "respawn" && message.down_for != null ? `  after ${message.down_for}s` : "") +
      (message.kind === "level_up" ? `  → ${message.level}` : "") +
      (message.kind === "roster" ? `  ${message.champions.join(", ")}` : "");
  line.append(when, what);
  const log = $("log");
  log.prepend(line);
  while (log.childElementCount > 200) log.lastElementChild.remove();
}

// EventSource reconnects by itself and volunteers Last-Event-ID when it
// does, so protocol-level resume costs this page nothing at all.
const stream = new EventSource("/stream");
stream.addEventListener("frame", e => onFrame(JSON.parse(e.data)));
stream.addEventListener("event", e => logLine(JSON.parse(e.data)));
stream.addEventListener("gap", e => logLine({ kind: "gap", ...JSON.parse(e.data) }));
stream.onopen = () => { $("status").textContent = "● live"; $("status").className = "live"; };
stream.onerror = () => { $("status").textContent = "reconnecting…"; $("status").className = "down"; };
</script>
</body>
</html>
